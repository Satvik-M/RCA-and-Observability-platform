services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # NOTE: localhost:9092 is for your host machine. kafka:29092 is for other containers.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    platform: linux/arm64
    container_name: elasticsearch # Added a container_name
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"

  # --- ADD OUR 3 NEW SERVICES BELOW ---

  ingestion-service:
    build: ./services/ingestion-service
    container_name: ingestion-service
    ports:
      - "8080:8080" # Expose the API port
    depends_on:
      - kafka

  log-processing-service:
    build: ./services/log-processing-service
    container_name: log-processing-service
    depends_on:
      - kafka
      - elasticsearch

  ai-analysis-service:
    build: ./services/ai-analysis-service
    container_name: ai-analysis-service
    depends_on:
      - kafka